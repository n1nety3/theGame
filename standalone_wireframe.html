<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Game - Planetary Grid Architecture (Standalone)</title>
  <style>
    :root {
      --bg-space: #050814;

      /* Core Game Accent (Yellow) */
      --core-accent: #ffe600;
      --core-accent-bright: #fff066;
      --core-accent-glow: rgba(255, 230, 0, 0.4);
      --core-accent-subtle: rgba(255, 230, 0, 0.12);
      --color-yellow: #ffe600;

      --color-cyan: #00f0ff;
      --color-violet: #a855f7;
      --color-amber: #f59e0b;
      --color-amber-bright: #fbbf24;
      --color-emerald: #10b981;
      --color-crimson: #ef4444;
      --color-orange: #f97316;
      --color-teal: #06b6d4;
      --color-slate: #334155;

      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', 'Segoe UI Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-space);
      font-family: var(--font-mono);
      color: #e2e8f0;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      cursor: default;
    }

    #canvas-container.zone-view {
      cursor: grab;
    }

    #canvas-container.zone-view:active {
      cursor: grabbing;
    }

  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script src="client/js/wireframe-app.js"></script>
</body>
</html>
